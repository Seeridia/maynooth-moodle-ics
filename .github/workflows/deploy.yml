name: Deploy to Server

on:
  push:
    branches:
      - main
    tags:
      - "release-v*"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      MOODLE_URL: https://example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run type checks
        run: bun run typecheck

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/release-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync Compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: "${{ secrets.TARGET_DIR }}/"

      - name: Pull the ACR image and restart the service
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script_stop: true
          envs: RELEASE_TAG
          script: |
            set -eu
            export IMAGE_TAG="${RELEASE_TAG#release-v}"
            if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "$RELEASE_TAG" ]; then
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
            fi
            cd "${{ secrets.TARGET_DIR }}"

            attempt=1
            max_attempts=90
            until docker compose pull app; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Timed out waiting for ACR image tag: $IMAGE_TAG" >&2
                exit 1
              fi
              echo "ACR image pull failed; retrying in 20 seconds ($attempt/$max_attempts)"
              sleep 20
              attempt=$((attempt + 1))
            done

            docker compose up -d --no-build

            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' maynooth-moodle-ics)" = healthy ]; then
                docker compose ps
                exit 0
              fi
              sleep 5
            done

            docker compose ps
            docker logs --tail 50 maynooth-moodle-ics
            exit 1
