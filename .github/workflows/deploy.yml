name: Deploy to Server

on:
  push:
    branches:
      - main
    tags:
      - "release-v*"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      MOODLE_URL: https://example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run type checks
        run: bun run typecheck

      - name: Verify Docker build
        run: docker build -t maynooth-moodle-ics:test .

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/release-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve ACR image tag
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release-v}"
          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "Expected a release-v* tag, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "image_tag=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p "${{ secrets.TARGET_DIR }}"

      - name: Sync Compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: "${{ secrets.TARGET_DIR }}/"

      - name: Write .env on server
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        if: ${{ env.ENV_FILE != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat <<'EOF' > "${{ secrets.TARGET_DIR }}/.env"
            ${{ secrets.ENV_FILE }}
            EOF

      - name: Pull the ACR image and restart the service
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 35m
          script_stop: true
          envs: IMAGE_TAG
          script: |
            set -eu
            cd "${{ secrets.TARGET_DIR }}"

            attempt=1
            max_attempts=90
            until IMAGE_TAG="$IMAGE_TAG" docker compose pull app; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Timed out waiting for ACR image tag: $IMAGE_TAG" >&2
                exit 1
              fi
              echo "ACR image is not ready; retrying in 20 seconds ($attempt/$max_attempts)"
              sleep 20
              attempt=$((attempt + 1))
            done

            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-build --remove-orphans
            docker compose ps
