services:
  app:
    image: ${TCR_REGISTRY:-hkccr.ccs.tencentyun.com}/${TCR_NAMESPACE:-seeridia-static}/${TCR_REPOSITORY:-moodle-ics}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: maynooth-moodle-ics
    restart: always
    ports:
      - "4700:3000"
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
